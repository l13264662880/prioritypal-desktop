<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PriorityPal 小猫桌宠</title>
  <style>
    /* ============ 拟人小猫桌宠 · 分层换装 ============
       渲染层级（避免穿模）：本体 → 尾巴 → 下装 → 上衣 → 鞋子 → 头部配饰 → 背饰 → 手持物
       所有层都是 96×104 画布内联 SVG 组，透明背景，按 order 叠放。
       动画只作用于小猫本体（呼吸/眨眼/弹跳），服装层只做淡入淡出。 */
    :root {
      --fur: #fff8eb;        /* 奶白毛色 */
      --fur-shade: #f3e7cd;
      --line: #6e543e;       /* 深棕描边 */
      --pink: #ffb6b2;
      --bubble-bg: #fffdf8;
      --bubble-line: rgba(255, 143, 92, .4);
      --bubble-text: #3a3128;
      --bubble-label: #ff5c3a;
      --btn-bg: rgba(110, 84, 62, .16);
      --btn-fg: #8a7052;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent !important; overflow: hidden;
      -webkit-app-region: drag; user-select: none;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .stage {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end; padding-bottom: 4px;
    }
    .bubble {
      position: relative; width: 188px; box-sizing: border-box;
      margin-bottom: 6px; padding: 8px 12px;
      background: var(--bubble-bg); border: 1px solid var(--bubble-line);
      border-radius: 8px; box-shadow: 0 2px 8px rgba(110,84,62,.18);
      color: var(--bubble-text); font-size: 13px; line-height: 1.5;
      text-align: center; cursor: pointer; -webkit-app-region: no-drag;
      transition: transform .3s;
    }
    .bubble:hover { transform: translateY(-1px); }
    .bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -6px;
      width: 10px; height: 10px; margin-left: -5px;
      background: var(--bubble-bg);
      border-right: 1px solid var(--bubble-line); border-bottom: 1px solid var(--bubble-line);
      transform: rotate(45deg);
    }
    .bubble-label {
      display: block; margin-bottom: 2px; font-size: 10px;
      letter-spacing: .16em; color: var(--bubble-label);
    }
    .bubble-text {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; text-overflow: ellipsis; word-break: break-word; min-height: 1.5em;
    }
    .sprite { position: relative; width: 96px; height: 104px; cursor: grab; }
    .sprite:active { cursor: grabbing; }
    .sprite svg { display: block; width: 100%; height: 100%; overflow: visible; }

    /* 呼吸：待机的轻微晃动，幅度小（常驻不骚扰） */
    .sprite-body { animation: breathe 4.2s ease-in-out infinite; transform-origin: 48px 96px; }
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2.5px); }
    }
    /* 眨眼 / 睡觉 / 专注：本体的四种帧组，显示其一 */
    .frame { display: none; }
    .frame.is-on { display: inline; }
    /* 尾巴轻摆 */
    .tail-wag { animation: wag 3.4s ease-in-out infinite; transform-origin: 66px 82px; }
    @keyframes wag { 0%,100% { transform: rotate(-6deg);} 50% { transform: rotate(8deg);} }
    /* 服装层淡入淡出 */
    .outfit { opacity: 0; transition: opacity .28s; pointer-events: none; }
    .outfit.is-on { opacity: 1; }
    /* 悬停微微放大：注意到你了 */
    .sprite { transition: transform .22s; }
    .sprite:hover { transform: scale(1.04); }
    /* 开心弹跳 */
    .sprite.bounce { animation: bounce .54s cubic-bezier(.34,1.56,.64,1); }
    @keyframes bounce {
      0%,100% { transform: scale(1); }
      35% { transform: scale(1.08,1.12); }
      70% { transform: scale(.96,.95); }
    }
    /* 右键换装菜单 */
    .ctx {
      position: fixed; display: none; z-index: 99;
      background: var(--bubble-bg); border: 1px solid var(--bubble-line);
      border-radius: 8px; box-shadow: 0 4px 14px rgba(110,84,62,.25);
      padding: 4px; min-width: 132px; -webkit-app-region: no-drag;
    }
    .ctx .item {
      display: block; width: 100%; text-align: left; border: none; background: none;
      padding: 6px 10px; font-size: 12.5px; color: var(--bubble-text);
      cursor: pointer; border-radius: 5px; font-family: inherit;
    }
    .ctx .item:hover { background: rgba(255,143,92,.14); }
    .ctx .group { position: relative; }
    .ctx .group > .item::after { content: "▸"; float: right; color: var(--btn-fg); }
    .ctx .sub {
      display: none; position: absolute; left: 100%; top: -5px;
      background: var(--bubble-bg); border: 1px solid var(--bubble-line);
      border-radius: 8px; padding: 4px; min-width: 118px; max-height: 260px; overflow-y: auto;
    }
    .ctx .group:hover > .sub { display: block; }
    /* 关闭/换装按钮：hover 才出现 */
    .win-btn {
      position: absolute; top: 2px; width: 20px; height: 20px;
      display: grid; place-items: center; border: none; border-radius: 50%;
      background: var(--btn-bg); color: var(--btn-fg); font-size: 11px;
      cursor: pointer; opacity: 0; transition: opacity .2s; -webkit-app-region: no-drag;
    }
    .stage:hover .win-btn { opacity: 1; }
    .win-btn:hover { background: rgba(255,143,92,.24); }
    #dressBtn { right: 28px; } #closeBtn { right: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .sprite-body, .tail-wag { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bubble" id="bubble" title="点击打开任务面板">
      <span class="bubble-label" id="bubbleLabel">现在最该做</span>

    <button class="win-btn" id="dressBtn" title="换装：下一套主题">🎨</button>
    <button class="win-btn" id="closeBtn" title="隐藏小猫">✕</button>

    <!-- 右键菜单（DOM 实现，不依赖主进程） -->
    <div class="ctx" id="ctxMenu"></div>
  </div>

  <script>
    (function () {
      'use strict';

      const bubble = document.getElementById('bubble');
      const bubbleText = document.getElementById('bubbleText');
      const bubbleLabel = document.getElementById('bubbleLabel');
      const spriteBody = document.getElementById('spriteBody');
      const spriteEl = document.getElementById('sprite');
      const closeBtn = document.getElementById('closeBtn');
      const ctxMenu = document.getElementById('ctxMenu');
      const LABEL_DEFAULT = '现在最该做';

      /* ---------- 气泡 ---------- */
      let labelTimer = null;
      function showBubble(text) {
        bubbleText.textContent = text;
        spriteEl.classList.remove('bounce'); void spriteEl.offsetWidth;
        spriteEl.classList.add('bounce');
      }
      function flashLabel(text) {
        bubbleLabel.textContent = text;
        clearTimeout(labelTimer);
        labelTimer = setTimeout(() => { bubbleLabel.textContent = LABEL_DEFAULT; }, 1600);
      }
      bubble.addEventListener('click', () => {
        if (window.priorityPal) window.priorityPal.openPanel();
      });

      /* ---------- 本体四帧切换（动画只绘制本体） ---------- */
      const frames = {};
      document.querySelectorAll('.frame').forEach((g) => { frames[g.dataset.frame] = g; });
      let currentFrame = 'idle';
      let pomPhase = 'idle';
      let sleeping = false;
      function setFrame(name) {
        if (!frames[name] || name === currentFrame) return;
        frames[currentFrame].classList.remove('is-on');
        frames[name].classList.add('is-on');
        currentFrame = name;
      }
      /* 眨眼：随机 2.5–6s 闭眼 0.15s（仅空闲时） */
      (function scheduleBlink() {
        setTimeout(() => {
          if (pomPhase === 'idle' && !sleeping) {
            setFrame('blink');
            setTimeout(() => setFrame('idle'), 150);
          }
          scheduleBlink();
        }, 2500 + Math.random() * 3500);
      })();

      /* ---------- 长时间无操作 → 休眠打哈欠 ---------- */
      let lastActive = Date.now();
      ['mousedown', 'mousemove', 'keydown'].forEach((evt) =>
        window.addEventListener(evt, () => { lastActive = Date.now(); if (sleeping) wake(); }));
      setInterval(() => {
        if (pomPhase !== 'idle') { sleeping = false; if (currentFrame !== 'focus') setFrame('idle'); return; }
        if (!sleeping && Date.now() - lastActive > 90000) {
          sleeping = true;
          setFrame('sleep');
          showBubble('Zzz…（点我醒来）');
        }
      }, 5000);
      function wake() {
        lastActive = Date.now();
        if (sleeping) { sleeping = false; setFrame(pomPhase === 'focus' ? 'focus' : 'idle'); }
      }

      /* ---------- 服装系统（渲染层级：本体→尾巴→下装→上衣→鞋→头→背→手） ---------- */
      const THEMES = ['daily', 'school', 'home', 'halloween', 'christmas', 'sport', 'idol', 'summer'];
      const THEME_NAMES = { daily: '日常休闲', school: '校园学霸', home: '居家慵懒', halloween: '万圣节',
                            christmas: '圣诞', sport: '运动活力', idol: '偶像打歌', summer: '夏日海边' };
      const SLOTS = ['head', 'top', 'bottom', 'shoes', 'back', 'hand'];
      const OUTFIT_KEY = 'cat-outfit';
      let outfit = { mode: 'theme', theme: 'daily', parts: {} };
      try {
        const saved = JSON.parse(localStorage.getItem(OUTFIT_KEY) || 'null');
        if (saved) outfit = saved;
      } catch (err) { /* 忽略 */ }

      function applyOutfit() {
        document.querySelectorAll('.outfit').forEach((g) => {
          const on = outfit.mode === 'theme' ? g.dataset.theme === outfit.theme : false;
          g.classList.toggle('is-on', on);
          if (outfit.mode === 'theme') {
            g.querySelectorAll('[data-slot]').forEach((p) => { p.style.display = ''; });
          }
        });
        if (outfit.mode === 'custom') {
          // 自由拼装：点亮含选中部件的主题组，并只显示被选中的槽位
          const chosen = outfit.parts || {};
          document.querySelectorAll('.outfit').forEach((g) => {
            let has = false;
            g.querySelectorAll('[data-slot]').forEach((part) => {
              const slot = part.dataset.slot;
              const show = chosen[slot] && chosen[slot] === `themes/${g.dataset.theme}/${slot}.png`;
              part.style.display = show ? '' : 'none';
              if (show) has = true;
            });
            g.classList.toggle('is-on', has);
          });
        }
        try { localStorage.setItem(OUTFIT_KEY, JSON.stringify(outfit)); } catch (err) { /* 忽略 */ }
      }

      function setTheme(theme) {
        outfit = { mode: 'theme', theme, parts: {} };
        applyOutfit();
        flashLabel(THEME_NAMES[theme]);
        showBubble(`换上「${THEME_NAMES[theme]}」啦~`);
      }
      function setPart(slot, rel) {
        outfit.mode = 'custom';
        if (rel) outfit.parts[slot] = rel;
        else delete outfit.parts[slot];
        applyOutfit();
        flashLabel('自由搭配');
      }

      /* ---------- 番茄状态联动（面板写 localStorage，这里 storage 事件接收） ---------- */
      function onPomState(state) {
        pomPhase = state;
        if (state === 'focus') { setFrame('focus'); showBubble('专注模式，喵~'); }
        else if (state === 'rest') { setFrame('idle'); showBubble('休息一下~'); }
        else setFrame('idle');
      }
      try { pomPhase = localStorage.getItem('pom-state') || 'idle'; } catch (err) {}
      setFrame(pomPhase === 'focus' ? 'focus' : 'idle');
      window.addEventListener('storage', (e) => {
        if (e.key === 'pom-state') onPomState(e.newValue || 'idle');
      });

      /* ---------- 闲逛：沿屏幕底部缓慢来回（经主进程移动窗口） ---------- */
      let wanderDir = 1, wanderPause = 0;
      setInterval(() => {
        if (pomPhase === 'focus' || sleeping || !window.priorityPal) return;
        if (wanderPause > 0) { wanderPause--; return; }
        if (Math.random() < 0.05) { wanderPause = 20 + Math.random() * 80; return; }
        if (Math.random() < 0.1) wanderDir *= -1;
        window.priorityPal.moveSprite(window.screenX + wanderDir * 36, window.screenY);
      }, 1600);

      /* ---------- 交互：左键弹跳+拖拽 / 双击面板 / 右键菜单 ---------- */
      let dragOrigin = null;
      spriteEl.addEventListener('mousedown', (event) => {
        if (event.button !== 0) return;
        wake();
        hideMenu();
        dragOrigin = { winX: window.screenX, winY: window.screenY, mx: event.screenX, my: event.screenY };
        event.preventDefault();
      });
      window.addEventListener('mousemove', (event) => {
        if (!dragOrigin || !window.priorityPal) return;
        window.priorityPal.moveSprite(dragOrigin.winX + event.screenX - dragOrigin.mx,
                                      dragOrigin.winY + event.screenY - dragOrigin.my);
      });
      window.addEventListener('mouseup', () => {
        if (dragOrigin) spriteEl.classList.add('bounce');   // 松手开心弹一下
        dragOrigin = null;
      });
      spriteEl.addEventListener('dblclick', () => {
        if (window.priorityPal) window.priorityPal.openPanel();
      });

      /* ---------- 右键菜单 ---------- */
      function hideMenu() { ctxMenu.style.display = 'none'; }
      document.addEventListener('click', hideMenu);
      document.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        wake();
        buildMenu();
        ctxMenu.style.display = 'block';
        ctxMenu.style.left = Math.min(event.clientX, window.innerWidth - ctxMenu.offsetWidth - 4) + 'px';
        ctxMenu.style.top = Math.min(event.clientY, window.innerHeight - ctxMenu.offsetHeight - 4) + 'px';
      });

      function buildMenu() {
        ctxMenu.innerHTML = '';
        // 整套主题换装
        const themeGroup = document.createElement('div');
        themeGroup.className = 'group';
        const themeBtn = document.createElement('button');
        themeBtn.className = 'item'; themeBtn.textContent = '整套主题换装';
        themeGroup.appendChild(themeBtn);
        const themeSub = document.createElement('div');
        themeSub.className = 'sub';
        THEMES.forEach((key) => {
          const b = document.createElement('button');
          b.className = 'item';
          b.textContent = (outfit.mode === 'theme' && outfit.theme === key ? '✓ ' : '') + THEME_NAMES[key];
          b.addEventListener('click', () => { setTheme(key); hideMenu(); });
          themeSub.appendChild(b);
        });
        themeGroup.appendChild(themeSub);
        ctxMenu.appendChild(themeGroup);
        // 自由搭配（6 槽位 × 8 主题的部件池）
        const mixGroup = document.createElement('div');
        mixGroup.className = 'group';
        const mixBtn = document.createElement('button');
        mixBtn.className = 'item'; mixBtn.textContent = '自由搭配';
        mixGroup.appendChild(mixBtn);
        const mixSub = document.createElement('div');
        mixSub.className = 'sub';
        const SLOT_NAMES = { head: '头部配饰', top: '上衣', bottom: '下装', shoes: '鞋子', back: '背饰', hand: '手持物' };
        SLOTS.forEach((slot) => {
          const g = document.createElement('div');
          g.className = 'group';
          const b = document.createElement('button');
          b.className = 'item'; b.textContent = SLOT_NAMES[slot];
          g.appendChild(b);
          const sub = document.createElement('div');
          sub.className = 'sub';
          const none = document.createElement('button');
          none.className = 'item'; none.textContent = '(不佩戴)';
          none.addEventListener('click', () => { setPart(slot, null); hideMenu(); });
          sub.appendChild(none);
          THEMES.forEach((key) => {
            const b2 = document.createElement('button');
            b2.className = 'item'; b2.textContent = THEME_NAMES[key];
            b2.addEventListener('click', () => { setPart(slot, `themes/${key}/${slot}.png`); hideMenu(); });
            sub.appendChild(b2);
          });
          g.appendChild(sub);
          mixSub.appendChild(g);
        });
        mixGroup.appendChild(mixSub);
        ctxMenu.appendChild(mixGroup);
        // 快速番茄 + 退出
        const pom = document.createElement('button');
        pom.className = 'item'; pom.textContent = '快速启动番茄钟';
        pom.addEventListener('click', () => {
          try { localStorage.setItem('pom-command', 'start'); } catch (err) {}
          showBubble('番茄钟已启动！');
          hideMenu();
        });
        ctxMenu.appendChild(pom);
        const quit = document.createElement('button');
        quit.className = 'item'; quit.textContent = '退出程序';
        quit.addEventListener('click', () => { window.close(); });
        ctxMenu.appendChild(quit);
      }

      /* ---------- 面板推来的任务更新（IPC，保持原有通道） ---------- */
      if (window.priorityPal) {
        window.priorityPal.onTaskUpdate((payload) => {
          if (payload && typeof payload.firstTask === 'string' && payload.firstTask) {
            bubbleText.textContent = payload.firstTask;
          }
        });
        window.priorityPal.requestState().then((state) => {
          if (state && typeof state.firstTask === 'string' && state.firstTask) {
            bubbleText.textContent = state.firstTask;
          }
        }).catch(() => { /* 面板未开 */ });
      }

      closeBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        if (window.priorityPal) window.priorityPal.hideSprite();
      });
      document.getElementById('dressBtn').addEventListener('click', (event) => {
        event.stopPropagation();
        const cur = outfit.mode === 'theme' ? outfit.theme : 'daily';
        setTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
      });

      applyOutfit();
      // 预览/测试：?theme=<key> 直接指定主题（不影响保存的穿搭）
      try {
        const q = new URLSearchParams(location.search).get('theme');
        if (q && THEMES.includes(q)) { outfit = { mode: 'theme', theme: q, parts: {} }; applyOutfit(); }
      } catch (err) { /* 忽略 */ }
    })();
  </script>
