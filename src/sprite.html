<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PriorityPal 精灵</title>
  <style>
    /* 精灵各部位颜色都用 CSS 变量驱动，方便「换装」——
       换一套主题就是换一组变量的值，SVG 和气泡的 fill/color 全部 var() 引用。
       默认是「奶黄包」主题，JS 里可以切到别的主题。 */
    :root {
      /* 拟人本体肤色（身体/四肢），头发与鞋是固定色 */
      --body-top: #ffead2;
      --body-bottom: #f8d2a8;
      --limb: #f7cda3;
      --hair: #6f4a32;
      --sprout-a: #7bc96f;
      --sprout-b: #96d98a;
      --sprout-stem: #66b85a;
      --eye: #4a3525;
      --blush: rgba(247, 130, 120, .5);
      --face: #fffdf6;
      --glow: rgba(255, 255, 255, .4);
      --shadow: rgba(150, 110, 40, .16);
      --bubble-bg: #fffdf8;
      --bubble-line: rgba(255, 92, 58, .35);
      --bubble-text: #332b23;
      --bubble-label: #ff5c3a;
      --close-bg: rgba(180, 130, 40, .14);
      --close-fg: #b89a5e;
      --close-hover-bg: rgba(247, 160, 150, .22);
      --close-hover-fg: #e08a6a;
    }

    /* 精灵窗是透明无边框的，所以：
       · html/body 必须完全透明，否则会是一个白色方块
       · 任何地方都不能出现不透明的大面积背景
       · 圆角/阴影只加在精灵本体上 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      /* 整窗可拖动。但按钮要能点，后面用 no-drag 单独豁免 */
      -webkit-app-region: drag;
      user-select: none;
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 6px;
    }

    /* 气泡：显示「现在最该做的一件事」。
       这是整个精灵的存在意义 —— 它不只是一个装饰摆件。

       宽度与行数都必须锁死：
         桌面常驻的小窗口，被一条长任务撑成三行会挡住底下的东西，
         而且精灵本身会被挤变形。这里固定两行、超出截断加省略号。 */
    .bubble {
      position: relative;
      width: 188px;              /* 固定宽，不随内容伸缩 */
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 9px 13px;
      background: var(--bubble-bg);
      border: 1px solid var(--bubble-line);
      border-radius: 8px;
      box-shadow: 0 2px 8px var(--shadow);
      color: var(--bubble-text);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: .02em;
      text-align: center;
      cursor: pointer;
      -webkit-app-region: no-drag;   /* 气泡可点，不参与拖动 */
      transition: transform 300ms cubic-bezier(.4, 0, .2, 1);
    }
    .bubble:hover { transform: translateY(-1px); }

    /* 气泡下面的小尖角 */
    .bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      background: var(--bubble-bg);
      border-right: 1px solid var(--bubble-line);
      border-bottom: 1px solid var(--bubble-line);
      transform: rotate(45deg);
    }

    /* 气泡里那行「现在最该做」的小标签 */
    .bubble-label {
      display: block;
      margin-bottom: 3px;
      font-size: 10px;
      letter-spacing: .18em;
      color: var(--bubble-label);
    }
    .bubble-text {
      display: -webkit-box;
      -webkit-line-clamp: 2;        /* 最多两行 */
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      min-height: 1.5em;
    }
    .bubble.is-empty .bubble-text { color: var(--close-fg); }

    /* 精灵本体 */
    .sprite {
      position: relative;
      width: 96px;
      height: 104px;
      cursor: grab;
    }
    .sprite:active { cursor: grabbing; }

    .sprite svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 呼吸：极缓慢的上下浮动，代表「活着」。
       幅度必须小 —— 桌面上常驻的东西动作一大就变骚扰。 */
    .sprite-body {
      animation: breathe 4.2s ease-in-out infinite;
      transform-origin: 50% 100%;
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    /* 叶芽（呆毛）随风轻摆：周期长、幅度小，只在头顶悄悄动一下 */
    .sprout {
      animation: sway 3.8s ease-in-out infinite;
      transform-origin: 48px 8px;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(4deg); }
    }

    /* 服装层：默认透明，当前套加 is-on 淡入（用 opacity 而非 display，才能做过渡） */
    .outfit { opacity: 0; transition: opacity 280ms cubic-bezier(.16, 1, .3, 1); pointer-events: none; }
    .outfit.is-on { opacity: 1; pointer-events: auto; }

    /* 精灵本体：悬停时轻轻放大一点，像「注意到你了」 */
    .sprite { transition: transform 220ms cubic-bezier(.4, 0, .2, 1); }
    .sprite:hover { transform: scale(1.04); }

    /* 弹跳：第一件事变化时由 JS 加一次 bounce 类。
       用 scale 而不是 translateY，跟 breathe 的浮动不冲突 */
    .sprite.bounce {
      animation: bounce 540ms cubic-bezier(.34, 1.56, .64, 1);
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      35%      { transform: scale(1.08, 1.12); }
      70%      { transform: scale(.96, .95); }
    }

    /* 眨眼：随机间隔由 JS 控制，这里只管动一下 */
    .eye { animation: none; }
    .sprite-body.blink .eye {
      animation: blink 160ms ease-in-out;
    }
    @keyframes blink {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(.08); }
    }

    /* 说话：气泡出现时轻轻弹一下 */
    .sprite-body.talk .mouth {
      animation: talk 420ms ease-in-out;
    }
    @keyframes talk {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.9); }
    }

    /* 关闭按钮：鼠标移上去才出现，平时不占视觉 */
    .close-btn {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: var(--close-bg);
      color: var(--close-fg);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 200ms ease;
      -webkit-app-region: no-drag;
      font-family: "Segoe UI Symbol", system-ui, sans-serif;
    }
    .stage:hover .close-btn { opacity: 1; }
    .close-btn:hover { background: var(--close-hover-bg); color: var(--close-hover-fg); }

    /* 换装按钮：放在关闭按钮左边，鼠标移上去才出现 */
    .dress-btn {
      position: absolute;
      top: 4px;
      right: 30px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: var(--close-bg);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 200ms ease;
      -webkit-app-region: no-drag;
    }
    .stage:hover .dress-btn { opacity: 1; }
    .dress-btn:hover { background: var(--close-hover-bg); }

    /* 尊重系统「减少动态效果」 */
    @media (prefers-reduced-motion: reduce) {
      .sprite-body, .eye, .mouth { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">

    <!-- 说话气泡：显示当前「第一件事」。点它打开任务面板 -->
    <div class="bubble" id="bubble" title="点击打开任务面板">
      <span class="bubble-label" id="bubbleLabel">现在最该做</span>
      <span class="bubble-text" id="bubbleText">先加一件事</span>
    </div>

    <!-- 精灵本体：Q 版形象，纯内联 SVG，不依赖任何外部图片 -->
    <div class="sprite" id="sprite">
      <svg viewBox="0 0 96 104" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 身体渐变：基础肤色 -->
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--body-top)" />
            <stop offset="1" stop-color="var(--body-bottom)" />
          </linearGradient>
          <!-- 头部渐变：比身体略亮一档，视觉焦点在脸上 -->
          <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff1dd" />
            <stop offset="1" stop-color="var(--body-bottom)" />
          </linearGradient>
          <!-- 衣服明暗叠加：上亮下暗，模拟面料立体感 -->
          <linearGradient id="clothShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
          </linearGradient>
          <!-- 衣服投影：让衣服像浮在身体上，有厚度 -->
          <filter id="clothShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.22"/>
          </filter>
        </defs>
        <g class="sprite-body" id="spriteBody">
          <!-- 脚下投影 -->
          <ellipse cx="48" cy="100" rx="26" ry="4.5" fill="var(--shadow)" />

          <!-- ================= 拟人本体：Q 版三头身小帮手 ================= -->
          <!-- 层序：腿 → 身体/手 → 服装 → 头(脸) → 头发 → 呆毛豆芽 → 五官 → 鞋 -->

          <!-- 两条小腿 -->
          <ellipse cx="41" cy="86" rx="4.8" ry="9" fill="var(--limb)" />
          <ellipse cx="55" cy="86" rx="4.8" ry="9" fill="var(--limb)" />

          <!-- 身体（基础肤色，平时被服装盖住）+ 两只手臂 -->
          <path d="M38 52 C 35.5 62, 34.5 74, 36.5 84 L 59.5 84 C 61.5 74, 60.5 62, 58 52 Q 48 57 38 52 Z" fill="url(#bodyGrad)" />
          <ellipse cx="31.5" cy="65" rx="4.6" ry="10" fill="var(--limb)" transform="rotate(12 31.5 65)" />
          <ellipse cx="64.5" cy="65" rx="4.6" ry="10" fill="var(--limb)" transform="rotate(-12 64.5 65)" />

          <!-- 服装层：11 套（数据 outfit=0..10），套在新身体上 -->

          <!-- 0 玩趣明快：珊瑚橙背带裙 + 蝴蝶结 -->
          <g class="outfit" data-outfit="0">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M40 56 L 41 50 M 56 56 L 55 50" stroke="var(--outfit)" stroke-width="3" stroke-linecap="round"/>
            <circle cx="41" cy="50" r="1.8" fill="var(--outfit-2)"/>
            <circle cx="55" cy="50" r="1.8" fill="var(--outfit-2)"/>
            <rect x="41" y="74" width="14" height="6" rx="3" fill="var(--outfit-2)" opacity=".45"/>
            <path d="M45 8 C 38 1 27 0 23 5 C 19 10 29 15 36 11 C 41 9 44 8 45 8 Z" fill="var(--outfit)"/>
            <path d="M43 8 C 38 3 30 2 27 5 C 25 7 28 10 32 10 C 36 9 41 8 43 8 Z" fill="var(--outfit-2)" opacity=".55"/>
            <path d="M51 8 C 58 1 69 0 73 5 C 77 10 67 15 60 11 C 55 9 52 8 51 8 Z" fill="var(--outfit)"/>
            <path d="M53 8 C 58 3 66 2 69 5 C 71 7 68 10 64 10 C 60 9 55 8 53 8 Z" fill="var(--outfit-2)" opacity=".55"/>
            <path d="M47 11 Q 44 17 46 21 Q 48 23 50 21 Q 52 17 51 11 Z" fill="var(--outfit)"/>
            <path d="M53 11 Q 56 17 54 21 Q 52 23 50 21 Q 48 17 49 11 Z" fill="var(--outfit)" opacity=".8"/>
            <ellipse cx="50" cy="8" rx="5" ry="3.6" fill="var(--outfit-2)"/>
            <ellipse cx="48.5" cy="6.5" rx="1.8" ry="1.3" fill="#ffffff" opacity=".55"/>
          </g>

          <!-- 1 极致极简：素灰连衣裙 + 围巾 -->
          <g class="outfit" data-outfit="1">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M38 58 Q 48 64 58 58 L 58 63 Q 48 69 38 63 Z" fill="var(--outfit-2)"/>
          </g>

          <!-- 2 杂志编辑：朱砂连衣裙白领 + 贝雷帽 -->
          <g class="outfit" data-outfit="2">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M41 56 L 48 64 L 55 56 Q 48 60 41 56 Z" fill="#ffffff" opacity=".85"/>
            <path d="M44.5 59 L 40 56.5 L 40 62 Z" fill="var(--outfit-2)"/>
            <path d="M51.5 59 L 56 56.5 L 56 62 Z" fill="var(--outfit-2)"/>
            <circle cx="48" cy="62" r="2" fill="var(--outfit)"/>
            <circle cx="48" cy="70" r="1.4" fill="var(--outfit-2)"/>
            <circle cx="48" cy="77" r="1.4" fill="var(--outfit-2)"/>
            <path d="M26 14 Q 31 3 48 3 Q 65 3 70 14 Q 64 10 48 10 Q 32 10 26 14 Z" fill="var(--outfit)"/>
            <path d="M36 9 Q 43 5 50 5" stroke="#ffffff" stroke-width="2" fill="none" opacity=".4" stroke-linecap="round"/>
            <path d="M25 14 Q 48 20 71 14 Q 71 17 48 22 Q 25 17 25 14 Z" fill="var(--outfit-2)"/>
            <circle cx="48" cy="4" r="2.3" fill="var(--outfit-2)"/>
          </g>

          <!-- 3 暗夜：深蓝斗篷裙 + 星月尖帽 -->
          <g class="outfit" data-outfit="3">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M38 56 L 30 82 L 38 80 Z" fill="var(--outfit)" opacity=".85"/>
            <path d="M58 56 L 66 82 L 58 80 Z" fill="var(--outfit)" opacity=".85"/>
            <path d="M39 60 Q 48 66 57 60 Q 48 70 39 60 Z" fill="var(--outfit-2)" opacity=".55"/>
            <circle cx="41" cy="76" r="1.2" fill="#ffffff" opacity=".85"/>
            <circle cx="55" cy="80" r="1.2" fill="#ffffff" opacity=".85"/>
            <path d="M32 17 Q 39 8 48 2 Q 57 8 64 17 Q 57 13 48 13 Q 39 13 32 17 Z" fill="var(--outfit)"/>
            <path d="M45 7 Q 48 5 52 7" stroke="#ffffff" stroke-width="1.5" fill="none" opacity=".4"/>
            <path d="M29 17 Q 48 23 67 17 Q 67 19 48 25 Q 29 19 29 17 Z" fill="var(--outfit-2)"/>
            <path d="M57 4 A 4 4 0 1 1 64 8 A 3.2 3.2 0 1 0 57 4 Z" fill="#ffd23f"/>
            <path d="M42 5 L 43 7 L 45 7 L 43.6 8 L 44 10 L 42 8.8 L 40 10 L 40.4 8 L 39 7 L 41 7 Z" fill="#ffffff"/>
          </g>

          <!-- 4 自然有机：苔藓背带裙 + 花环 -->
          <g class="outfit" data-outfit="4">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M40 56 L 41 49 M 56 56 L 55 49" stroke="var(--outfit-2)" stroke-width="2.5" stroke-linecap="round"/>
            <rect x="42" y="78" width="12" height="6" rx="3" fill="var(--outfit-2)"/>
            <path d="M27 15 Q 40 6 48 6 Q 56 6 69 15" stroke="var(--outfit-2)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <g><circle cx="30" cy="11" r="2.3" fill="var(--outfit)"/><circle cx="30" cy="11" r="1" fill="#ffffff" opacity=".9"/></g>
            <g><circle cx="39" cy="7" r="2.3" fill="var(--outfit-2)"/><circle cx="39" cy="7" r="1" fill="#ffffff" opacity=".9"/></g>
            <g><circle cx="48" cy="6" r="2.5" fill="var(--outfit)"/><circle cx="48" cy="6" r="1.1" fill="#ffffff" opacity=".9"/></g>
            <g><circle cx="57" cy="7" r="2.3" fill="var(--outfit-2)"/><circle cx="57" cy="7" r="1" fill="#ffffff" opacity=".9"/></g>
            <g><circle cx="66" cy="11" r="2.3" fill="var(--outfit)"/><circle cx="66" cy="11" r="1" fill="#ffffff" opacity=".9"/></g>
          </g>

          <!-- 5 复古未来：霓虹铠甲 + 护目镜 + 天线 -->
          <g class="outfit" data-outfit="5">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M39 58 L 44 54 L 52 54 L 57 58 Q 48 65 39 58 Z" fill="var(--outfit-2)" opacity=".5"/>
            <path d="M37 68 L 45 65 L 45 82" stroke="var(--outfit-2)" stroke-width="1.5" fill="none"/>
            <path d="M59 68 L 51 65 L 51 82" stroke="var(--outfit-2)" stroke-width="1.5" fill="none"/>
            <path d="M48 9 L 52 2" stroke="var(--outfit)" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="53" cy="1.5" r="2.4" fill="var(--outfit-2)"/>
            <circle cx="53" cy="1.5" r="1" fill="#ffffff" opacity=".7"/>
            <rect x="31" y="31" width="15" height="11" rx="4.5" fill="var(--outfit)"/>
            <rect x="33" y="33" width="11" height="7" rx="3" fill="#0d0f0d" opacity=".5"/>

            <rect x="45.5" y="34.5" width="5" height="4.5" rx="1.5" fill="var(--outfit)"/>
            <path d="M31 34 L 27 32" stroke="var(--outfit)" stroke-width="2"/>

          <!-- 6 轻奢雅致：金色礼服披肩 + 礼帽 -->
          <g class="outfit" data-outfit="6">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M36 62 Q 48 72 60 62 L 60 66 Q 48 76 36 66 Z" fill="var(--outfit-2)"/>

            <path d="M37 15 L 37 6 Q 48 2 59 6 L 59 15 Q 48 11 37 15 Z" fill="var(--outfit)"/>
            <path d="M41 7 Q 48 4 55 7" stroke="#ffffff" stroke-width="1.5" fill="none" opacity=".45" stroke-linecap="round"/>
            <path d="M30 15 Q 48 20 66 15 Q 66 17.5 48 22 Q 30 17.5 30 15 Z" fill="var(--outfit-2)"/>
            <path d="M37 9 Q 48 12 59 9 L 59 11 Q 48 14 37 11 Z" fill="var(--outfit-2)"/>
            <rect x="46" y="9.5" width="4" height="4" rx="1" fill="#ffffff" opacity=".7"/>
          </g>

          <!-- 7 新春福气（特别篇）：朱红盘扣袄裙 + 福字瓜皮帽 -->
          <g class="outfit" data-outfit="7">
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M36 56 C 33 67, 32 78, 34 86 L 62 86 C 64 78, 63 67, 60 56 Q 48 61 36 56 Z" fill="url(#clothShade)"/>
            <path d="M48 56 L 42 50 M 48 56 L 54 50" stroke="var(--outfit-2)" stroke-width="2.4" stroke-linecap="round"/>

            <!-- 披风系带 + 领结 -->
            <path d="M34 62 L 40 70 M 62 62 L 56 70" stroke="var(--outfit-2)" stroke-width="2" stroke-linecap="round"/>

            <circle cx="46.5" cy="82.8" r="1.2" fill="var(--outfit)" opacity=".6"/>

            <path d="M38 20 C 34 8, 36 1, 41 0 C 46 2, 45 12, 43 20 Z" fill="#fffdf6" stroke="var(--outfit-2)" stroke-width="1.2"/>
            <path d="M40 18 C 38 10, 39 4, 41.5 3 C 44 6, 43.5 13, 42.5 18 Z" fill="#ffc9d6"/>

            <path d="M59.5 19 C 63 12, 65.5 8, 68.5 8 C 69 11, 65 17, 61 20 Z" fill="#ffc9d6"/>

          <!-- 9 派对时光（特别篇）：彩条尖帽 + 彩带披肩 -->
          <g class="outfit" data-outfit="9">
            <path d="M13 66 C 13 79, 26 96, 48 96 C 70 96, 83 79, 83 66 Q 48 75 13 66 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M13 66 C 13 79, 26 96, 48 96 C 70 96, 83 79, 83 66 Q 48 75 13 66 Z" fill="url(#clothShade)"/>
            <!-- 披肩彩点 -->
            <circle cx="26" cy="74" r="2" fill="var(--outfit-2)"/>

            <!-- 尖帽：斜戴，彩条纹 + 顶球 + 帽檐 -->
            <path d="M34 20 L 43 -2 L 56 18 Q 45 14 34 20 Z" fill="var(--outfit)"/>

            <circle cx="43.5" cy="-1.5" r="2.8" fill="var(--outfit-2)"/>

          <!-- 10 雨天出行（特别篇）：明黄雨衣帽 + 水滴纹 -->
          <g class="outfit" data-outfit="10">
            <path d="M13 66 C 13 79, 26 96, 48 96 C 70 96, 83 79, 83 66 Q 48 75 13 66 Z" fill="var(--outfit)" filter="url(#clothShadow)"/>
            <path d="M13 66 C 13 79, 26 96, 48 96 C 70 96, 83 79, 83 66 Q 48 75 13 66 Z" fill="url(#clothShade)"/>
            <!-- 雨衣门襟与扣子 -->
            <path d="M48 66 L 48 58" stroke="var(--outfit-2)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="48" cy="72" r="1.8" fill="var(--outfit-2)"/>
            <circle cx="48" cy="82" r="1.8" fill="var(--outfit-2)"/>
            <!-- 衣身水滴纹 -->
            <path d="M30 76 Q 27.5 80 30 82.5 Q 32.5 80 30 76 Z" fill="#ffffff" opacity=".75"/>
            <path d="M64 78 Q 61.5 82 64 84.5 Q 66.5 82 64 78 Z" fill="#ffffff" opacity=".75"/>
            <path d="M40 88 Q 38 91 40 93 Q 42 91 40 88 Z" fill="#ffffff" opacity=".6"/>
            <!-- 雨衣帽：连帽罩头 + 帽檐 + 帽绳小珠 -->
            <path d="M31 22 Q 29 6 48 4 Q 67 6 65 22 Q 56 15 48 15 Q 40 15 31 22 Z" fill="var(--outfit)"/>
            <path d="M29 21 Q 48 28 67 21 Q 68 25 48 30 Q 28 25 29 21 Z" fill="var(--outfit-2)" opacity=".9"/>
            <path d="M33 24 Q 33 32 38 36 M 63 24 Q 63 32 58 36" stroke="var(--outfit-2)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            <circle cx="38.5" cy="38" r="1.5" fill="var(--outfit-2)"/>

    <button class="dress-btn" id="dressBtn" title="换装" aria-label="换装：切换到下一套主题服装">🎨</button>
    <button class="close-btn" id="closeBtn" title="隐藏精灵">✕</button>
  </div>

  <script>
    /* sprite.js 的逻辑内联在这里：精灵窗结构简单，单独拆文件反而多一层加载。
       真正的任务数据和排序逻辑在 panel 里的 app.js，这里只读它同步过来的结果。 */
    (function () {
      'use strict';

      const bubble = document.getElementById('bubble');
      const bubbleText = document.getElementById('bubbleText');
      const bubbleLabel = document.getElementById('bubbleLabel');
      const spriteBody = document.getElementById('spriteBody');
      const spriteEl = document.getElementById('sprite');
      const closeBtn = document.getElementById('closeBtn');

      const LABEL_DEFAULT = '现在最该做';

      // 预览模式：?nobubble 隐藏气泡，只看精灵本体（服装总览页用）
      if (new URLSearchParams(location.search).has('nobubble')) {
        bubble.style.display = 'none';
      }

      /* ---------- 气泡文字 ---------- */

      function setText(text) {
        const isEmpty = !text || text === '先加一件事';
        const newText = isEmpty ? '先加一件事' : text;
        const changed = bubbleText.textContent !== newText;

        bubbleText.textContent = newText;
        bubble.classList.toggle('is-empty', isEmpty);

        if (!changed) return; // 文字没变就不折腾动画

        // 说话动画：文字变化时重播，表示「精灵在跟你讲」
        spriteBody.classList.remove('talk');
        void spriteBody.offsetWidth;   // 强制重排，让动画能重新触发
        spriteBody.classList.add('talk');

        bounce(); // 第一件事换了，精灵兴奋地弹一下
      }

      /* 弹一下：第一件事变化、换装等愉快时刻共用 */
      function bounce() {
        spriteEl.classList.remove('bounce');
        void spriteEl.offsetWidth;
        spriteEl.classList.add('bounce');
      }

      /* ---------- 眨眼 ----------
         不按固定节拍眨，否则一眼就看出来是循环动画。
         6–14 秒之间的随机间隔，看起来更像活的。 */
      function scheduleBlink() {
        const wait = 6000 + Math.random() * 8000;
        setTimeout(() => {
          spriteBody.classList.add('blink');
          setTimeout(() => spriteBody.classList.remove('blink'), 180);
          scheduleBlink();
        }, wait);
      }

      /* ---------- 交互 ---------- */

      // 点气泡 = 打开任务面板
      bubble.addEventListener('click', () => {
        if (window.priorityPal) window.priorityPal.openPanel();
      });

      // 点关闭 = 隐藏精灵（不是退出程序，托盘里还能叫回来）
      closeBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        if (window.priorityPal) window.priorityPal.hideSprite();
      });

      /* ---------- 拖动精灵 ----------
         透明无边框窗口没法靠系统标题栏拖。
         这里用「鼠标按下时的窗口位置 + 鼠标位移量」算出新位置，再交给主进程。
         注意用 screenX/screenY（屏幕坐标），不是 clientX/clientY（窗口内坐标），
         后者在窗口移动过程中会自己变化，用它算会抖。 */
      let dragOrigin = null;

      spriteEl.addEventListener('mousedown', (event) => {
        if (event.button !== 0) return;
        dragOrigin = {
          winX: window.screenX,
          winY: window.screenY,
          mouseX: event.screenX,
          mouseY: event.screenY,
        };
        event.preventDefault();
      });

      window.addEventListener('mousemove', (event) => {
        if (!dragOrigin || !window.priorityPal) return;
        const dx = event.screenX - dragOrigin.mouseX;
        const dy = event.screenY - dragOrigin.mouseY;
        window.priorityPal.moveSprite(dragOrigin.winX + dx, dragOrigin.winY + dy);
      });

      window.addEventListener('mouseup', () => { dragOrigin = null; });

      /* ---------- 服装系统 ----------
         精灵本色（身体/脸/眼睛/高光/气泡底色与正文色）是固定的，
         全部定义在上方 :root 的 CSS 默认值里，换装一个都不动；
         换装只切两样东西：
           1. 服装造型（.outfit 加 is-on 淡入）+ 服装配色（--outfit / --outfit-2）
           2. 气泡标签与边框色（用服装色呼应主题）
         叶芽（草）是初始主题「玩趣明快」的专属头饰，其他主题有自己的帽子/花环。
         注意：sprite-theme 的跨窗口联动只在同源窗口间生效（Electron 面板）；
         网页版部署在云端域名下，与本应用不同源，收不到 storage 事件——
         三端真正联动需要后端同步主题状态，当前未实现。 */
      const THEME_KEY = 'sprite-theme';
      const API_BASE = 'https://yuanjian-d5gdhcntg91022662.service.tcloudbase.com';
      // 站点访问令牌（Day 23+ 接口鉴权后必须带上，否则 /api/theme 一律 401）
      const APP_TOKEN = '81ad6640e81a92f614190806e95eac7938463655a73b33e7';
      // 服装顺序与面板 7 套主题一一对应：换装时把索引换成主题 id 同步到云端
      const THEME_IDS = ['play', 'minimal', 'editorial', 'dark', 'nature', 'retro', 'luxe'];
      const OUTFITS = [
        { name: '玩趣明快', main: '#ff5c3a', sub: '#ffd23f' },
        { name: '极致极简', main: '#555555', sub: '#9a9a9a' },
        { name: '杂志编辑', main: '#b3402a', sub: '#2a2218' },
        { name: '暗夜',     main: '#4a5a8a', sub: '#6ea8fe' },
        { name: '自然有机', main: '#7a9b6d', sub: '#c8b98a' },
        { name: '复古未来', main: '#39ff88', sub: '#00e5ff' },
        { name: '轻奢雅致', main: '#b8923f', sub: '#e0c68a' },
        // —— 特别篇：只在精灵换装里循环，不对应面板主题，不上云 ——
        { name: '新春福气', main: '#d8402a', sub: '#ffd23f' },
        { name: '中秋月兔', main: '#dfe7f5', sub: '#f5c542' },
        { name: '派对时光', main: '#7c5cff', sub: '#ff6fb0' },
        { name: '雨天出行', main: '#ffce3f', sub: '#4a90d9' },
      ];

      function applyTheme(idx) {
        const outfit = OUTFITS[idx];
        if (!outfit) return;
        const root = document.documentElement.style;
        root.setProperty('--outfit', outfit.main);
        root.setProperty('--outfit-2', outfit.sub);
        root.setProperty('--bubble-label', outfit.main);
        root.setProperty('--bubble-line', outfit.main + '55');

        // 服装淡入淡出（opacity 过渡，不瞬切）
        document.querySelectorAll('.outfit').forEach((g) => {
          g.classList.toggle('is-on', g.dataset.outfit === String(idx));
        });

        // 叶芽（草）只属于初始主题「玩趣明快」
        const sproutEl = document.querySelector('.sprout');
        if (sproutEl) sproutEl.style.display = idx === 0 ? '' : 'none';

        try { localStorage.setItem(THEME_KEY, String(idx)); } catch (err) { /* 忽略 */ }
      }

      // 把主题写到云端：fire-and-forget，失败静默（离线时本地换装依然生效）
      function syncThemeToServer(id) {
        if (!id) return; // 特别篇服装没有对应主题，不上云
        fetch(`${API_BASE}/api/theme`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-App-Token': APP_TOKEN },
          body: JSON.stringify({ theme: id }),
        }).catch(() => { /* 离线/网关异常时静默 */ });
      }

      // 从云端拉当前主题（云端 = 三端共享真相）：只启动时拉一次，不做轮询
      function pullThemeFromServer() {
        fetch(`${API_BASE}/api/theme`, { headers: { 'X-App-Token': APP_TOKEN } })
          .then((r) => (r.ok ? r.json() : null))
          .then((payload) => {
            if (!payload || !payload.ok) return;
            const id = payload.data && payload.data.theme;
            const serverIdx = THEME_IDS.indexOf(id);
            if (serverIdx >= 0 && serverIdx !== themeIdx) {
              themeIdx = serverIdx;
              applyTheme(themeIdx);
            }
          })
          .catch(() => { /* 离线时忽略 */ });
      }

      // 换装：点一下循环切到下一套服装；精灵弹一下，气泡标签短暂显示服装名
      const dressBtn = document.getElementById('dressBtn');
      let themeIdx = 0;
      let labelTimer = null;

      dressBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        themeIdx = (themeIdx + 1) % OUTFITS.length;
        applyTheme(themeIdx);
        bounce();
        clearTimeout(labelTimer);
        bubbleLabel.textContent = OUTFITS[themeIdx].name;
        labelTimer = setTimeout(() => { bubbleLabel.textContent = LABEL_DEFAULT; }, 1400);
        // 同步到云端：网页版等其余端在下次启动时跟上
        syncThemeToServer(THEME_IDS[themeIdx]);
      });

      /* ---------- 接收面板推过来的任务更新 ---------- */

      if (window.priorityPal) {
        window.priorityPal.onTaskUpdate((payload) => {
          if (payload && typeof payload.firstTask === 'string') setText(payload.firstTask);
        });

        // 启动时主动拉一次：精灵先开、面板后开的情况下，也能拿到正确的第一件事
        window.priorityPal.requestState().then((state) => {
          if (state && typeof state.firstTask === 'string') setText(state.firstTask);
        }).catch(() => { /* 面板还没开，保持默认文案 */ });
      }

      // 启动时恢复上次选的服装，再向云端对齐（云端 = 三端共享真相，最后写入者胜）
      // ?outfit=N：预览/测试用，直接指定服装且不向云端对齐（不影响日常使用）
      let previewLock = false;
      try {
        const q = new URLSearchParams(location.search).get('outfit');
        if (q !== null && OUTFITS[+q]) { themeIdx = +q; previewLock = true; }
        else {
          const saved = parseInt(localStorage.getItem(THEME_KEY) || '0', 10);
          if (OUTFITS[saved]) themeIdx = saved;
        }
      } catch (err) { /* 忽略 */ }
      applyTheme(themeIdx);
      if (!previewLock) pullThemeFromServer();

      scheduleBlink();
    })();
  </script>
