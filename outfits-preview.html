<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PriorityPal 小猫桌宠 · 8 套主题总览</title>
<style>
  body { font-family:"Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#f6f3ec,#eee9dd); margin:0; padding:16px 22px; color:#3a332b; }
  h1 { font-size:19px; margin:0 0 2px; }
  .sub { color:#8a8073; font-size:12px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(4, 150px); gap:8px; }
  .card { background:#fffdf8; border:1px solid #e6ddc9; border-radius:10px; padding:4px 6px 5px; text-align:center; box-shadow:0 2px 6px rgba(120,90,30,.08); }
  .card iframe { width:128px; height:120px; border:none; background:transparent; margin-top:-10px; }
  .card .name { font-size:12.5px; font-weight:bold; }
  .card .desc { font-size:10.5px; color:#9a9080; margin-top:0; }
</style>
</head>
<body>
<h1>拟人小猫桌宠 · 8 套主题总览</h1>
<div class="sub">奶白小猫 + 分层换装（本体→尾巴→下装→上衣→鞋→头饰→背饰→手持）· 2026-10-11</div>
<div class="grid" id="grid"></div>
<script>
const T = [["daily","日常休闲","卫衣+牛仔裤+奶茶"],["school","校园学霸","西装+学士帽+书包"],["home","居家慵懒","毛衣+睡裤+热水袋"],["halloween","万圣节","魔女袍+尖帽+南瓜灯"],["christmas","圣诞","圣诞袍+鹿角+礼物"],["sport","运动活力","球衣+护腕+篮球"],["idol","偶像打歌","演出服+翅膀+荧光棒"],["summer","夏日海边","T恤+泳圈+冰淇淋"]];
const g = document.getElementById("grid");
T.forEach(([key,name,desc]) => {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = '<iframe src="src/sprite.html?theme='+key+'"></iframe><div class="name">'+name+'</div><div class="desc">'+desc+'</div>';
  g.appendChild(d);
});
</script>
</body>
</html>
